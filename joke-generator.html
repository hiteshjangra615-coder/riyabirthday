<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #764ba2;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .joke-display {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            line-height: 1.6;
            animation: fadeIn 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .joke-setup {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .joke-punchline {
            color: #fff9e6;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            display: none;
        }

        .joke-punchline.show {
            display: block;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: none;
            color: #667eea;
            font-size: 1.2em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading.show {
            display: block;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-generate:active {
            transform: translateY(-1px);
        }

        .btn-punchline {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            display: none;
        }

        .btn-punchline.show {
            display: inline-block;
        }

        .btn-punchline:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-punchline:active {
            transform: translateY(-1px);
        }

        .btn-copy {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-copy:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-copy:active {
            transform: translateY(-1px);
        }

        .joke-category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        .error-message.show {
            display: block;
        }

        .joke-counter {
            color: #764ba2;
            margin-top: 20px;
            font-size: 0.95em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-display {
                font-size: 1.1em;
                min-height: 100px;
                padding: 20px;
            }

            .buttons-container {
                gap: 10px;
            }

            button {
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator 😂</h1>
        <p class="subtitle">Get random jokes instantly!</p>

        <div class="error-message" id="errorMessage"></div>

        <div class="joke-display" id="jokeDisplay">
            <div class="loading" id="loadingSpinner">⏳ Loading...</div>
            <div id="jokeContent" style="display: none;">
                <div class="joke-setup" id="jokeSetup"></div>
                <div class="joke-punchline" id="jokePunchline"></div>
                <div class="joke-category" id="jokeCategory"></div>
            </div>
        </div>

        <div class="buttons-container">
            <button class="btn-generate" onclick="generateJoke()">🎲 Get Random Joke</button>
            <button class="btn-punchline" id="punchlineBtn" onclick="showPunchline()">😂 Show Punchline</button>
            <button class="btn-copy" onclick="copyJoke()">📋 Copy Joke</button>
        </div>

        <div class="joke-counter">
            <span id="jokeCount">0</span> jokes loaded
        </div>
    </div>

    <script>
        let currentJoke = null;
        let jokeCount = 0;
        const loadingSpinner = document.getElementById('loadingSpinner');
        const jokeContent = document.getElementById('jokeContent');
        const jokeSetup = document.getElementById('jokeSetup');
        const jokePunchline = document.getElementById('jokePunchline');
        const jokeCategory = document.getElementById('jokeCategory');
        const punchlineBtn = document.getElementById('punchlineBtn');
        const errorMessage = document.getElementById('errorMessage');

        async function generateJoke() {
            try {
                // Clear previous state
                errorMessage.classList.remove('show');
                jokePunchline.classList.remove('show');
                punchlineBtn.classList.remove('show');
                jokeContent.style.display = 'none';
                loadingSpinner.classList.add('show');

                // Fetch joke from API (using Joke API)
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                currentJoke = data;
                jokeCount++;

                // Display the joke
                jokeSetup.textContent = data.setup;
                jokePunchline.textContent = data.punchline;
                jokeCategory.textContent = `Category: ${data.type.toUpperCase()}`;

                // Update UI
                loadingSpinner.classList.remove('show');
                jokeContent.style.display = 'block';
                punchlineBtn.classList.add('show');

                // Update counter
                document.getElementById('jokeCount').textContent = jokeCount;

            } catch (error) {
                console.error('Error fetching joke:', error);
                loadingSpinner.classList.remove('show');
                jokeContent.style.display = 'none';
                showError('Failed to load joke. Please try again!');
            }
        }

        function showPunchline() {
            jokePunchline.classList.add('show');
            punchlineBtn.textContent = '✅ Punchline Revealed';
            punchlineBtn.disabled = true;
        }

        function copyJoke() {
            if (!currentJoke) {
                showError('No joke to copy!');
                return;
            }

            const jokeText = `${currentJoke.setup}\n\n${currentJoke.punchline}`;
            navigator.clipboard.writeText(jokeText).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                showError('Failed to copy joke');
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Load a joke on page load
        generateJoke();
    </script>
</body>
</html>
