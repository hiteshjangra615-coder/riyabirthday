<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .search-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .search-container input {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            width: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
        }

        .search-container button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-container button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .search-container button:active {
            transform: translateY(-1px);
        }

        .main-weather {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .location-info h2 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 5px;
        }

        .location-info p {
            color: #999;
            font-size: 1.1em;
        }

        .temperature-display {
            text-align: right;
            animation: scaleIn 0.6s ease-out 0.4s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .temperature {
            font-size: 4em;
            color: #764ba2;
            font-weight: bold;
            line-height: 1;
        }

        .weather-condition {
            font-size: 1.3em;
            color: #666;
            text-transform: capitalize;
            margin-top: 10px;
        }

        .weather-icon {
            font-size: 4em;
            margin: 0 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .detail-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .detail-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .hourly-forecast {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .hourly-forecast h3 {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .forecast-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .forecast-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            min-width: 150px;
            transition: all 0.3s ease;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .forecast-time {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 2.5em;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.3em;
            font-weight: bold;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading.show {
            display: block;
        }

        .loading.hide {
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .temperature {
                font-size: 2.5em;
            }

            .weather-header {
                flex-direction: column;
                text-align: center;
            }

            .temperature-display {
                text-align: center;
            }

            .search-container input {
                width: 100%;
                max-width: 280px;
            }

            .main-weather {
                padding: 20px;
            }

            .forecast-cards {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }

        .weather-info-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            text-align: center;
            margin-top: 20px;
        }

        .weather-info-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
        </div>

        <div class="search-container">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                onkeypress="if(event.key === 'Enter') searchWeather()"
            >
            <button onclick="searchWeather()">🔍 Search</button>
        </div>

        <div class="loading" id="loadingSpinner">
            ⏳ Loading weather data...
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="main-weather" id="mainWeather" style="display: none;">
            <div class="weather-header">
                <div class="location-info">
                    <h2 id="cityName">--</h2>
                    <p id="dateTime">--</p>
                </div>
                <div style="display: flex; align-items: center;">
                    <div class="weather-icon" id="weatherIcon">🌡️</div>
                    <div class="temperature-display">
                        <div class="temperature" id="temperature">--°C</div>
                        <div class="weather-condition" id="weatherCondition">--</div>
                    </div>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-box">
                    <div class="detail-label">💧 Humidity</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">💨 Wind Speed</div>
                    <div class="detail-value" id="windSpeed">-- km/h</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">🔽 Pressure</div>
                    <div class="detail-value" id="pressure">-- hPa</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">👁️ Visibility</div>
                    <div class="detail-value" id="visibility">-- km</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">↑ Feels Like</div>
                    <div class="detail-value" id="feelsLike">--°C</div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">⛅ Cloud Cover</div>
                    <div class="detail-value" id="cloudCover">--%</div>
                </div>
            </div>
        </div>

        <div class="hourly-forecast" id="hourlyForecast" style="display: none;">
            <h3>⏰ Hourly Forecast</h3>
            <div class="forecast-cards" id="forecastCards">
                <!-- Forecast cards will be added here -->
            </div>
        </div>

        <div class="weather-info-link">
            Weather data powered by Open-Meteo API
        </div>
    </div>

    <script>
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const mainWeather = document.getElementById('mainWeather');
        const hourlyForecast = document.getElementById('hourlyForecast');

        function showLoading() {
            loadingSpinner.classList.remove('hide');
            loadingSpinner.classList.add('show');
            errorMessage.classList.remove('show');
            mainWeather.style.display = 'none';
            hourlyForecast.style.display = 'none';
        }

        function hideLoading() {
            loadingSpinner.classList.remove('show');
            loadingSpinner.classList.add('hide');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            mainWeather.style.display = 'none';
            hourlyForecast.style.display = 'none';
            hideLoading();
        }

        function getWeatherIcon(weatherCode) {
            // WMO Weather interpretation codes
            if (weatherCode === 0 || weatherCode === 1) return '☀️';
            if (weatherCode === 2) return '⛅';
            if (weatherCode === 3) return '☁️';
            if (weatherCode === 45 || weatherCode === 48) return '🌫️';
            if (weatherCode === 51 || weatherCode === 53 || weatherCode === 55) return '🌧️';
            if (weatherCode === 61 || weatherCode === 63 || weatherCode === 65) return '🌧️';
            if (weatherCode === 71 || weatherCode === 73 || weatherCode === 75) return '❄️';
            if (weatherCode === 77) return '❄️';
            if (weatherCode === 80 || weatherCode === 81 || weatherCode === 82) return '⛈️';
            if (weatherCode === 85 || weatherCode === 86) return '🌨️';
            if (weatherCode === 80 || weatherCode === 81 || weatherCode === 82) return '⛈️';
            return '🌡️';
        }

        function getWeatherDescription(weatherCode) {
            const descriptions = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Depositing rime fog',
                51: 'Light drizzle',
                53: 'Moderate drizzle',
                55: 'Dense drizzle',
                61: 'Slight rain',
                63: 'Moderate rain',
                65: 'Heavy rain',
                71: 'Slight snow',
                73: 'Moderate snow',
                75: 'Heavy snow',
                77: 'Snow grains',
                80: 'Slight rain showers',
                81: 'Moderate rain showers',
                82: 'Violent rain showers',
                85: 'Slight snow showers',
                86: 'Heavy snow showers',
            };
            return descriptions[weatherCode] || 'Unknown';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            showLoading();

            try {
                // First, geocode the city name
                const geoResponse = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
                );

                if (!geoResponse.ok) {
                    throw new Error('Failed to find city');
                }

                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    showError('City not found. Please try another city name.');
                    return;
                }

                const location = geoData.results[0];
                const { latitude, longitude, name, country } = location;

                // Get weather data
                const weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,humidity,weather_code,wind_speed_10m,pressure_msl,visibility,apparent_temperature,cloud_cover&hourly=temperature_2m,weather_code,precipitation_probability&timezone=auto`
                );

                if (!weatherResponse.ok) {
                    throw new Error('Failed to fetch weather data');
                }

                const weatherData = await weatherResponse.json();
                displayWeather(weatherData, name, country);

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to fetch weather data. Please try again.');
            }
        }

        function displayWeather(data, cityName, country) {
            const current = data.current;
            const hourly = data.hourly;

            // Update current weather
            document.getElementById('cityName').textContent = `${cityName}, ${country}`;
            document.getElementById('dateTime').textContent = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('temperature').textContent = `${Math.round(current.temperature_2m)}°C`;
            document.getElementById('weatherIcon').textContent = getWeatherIcon(current.weather_code);
            document.getElementById('weatherCondition').textContent = getWeatherDescription(current.weather_code);
            document.getElementById('humidity').textContent = `${current.humidity}%`;
            document.getElementById('windSpeed').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
            document.getElementById('pressure').textContent = `${Math.round(current.pressure_msl)} hPa`;
            document.getElementById('visibility').textContent = `${(current.visibility / 1000).toFixed(1)} km`;
            document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;
            document.getElementById('cloudCover').textContent = `${current.cloud_cover}%`;

            // Update hourly forecast
            const forecastCards = document.getElementById('forecastCards');
            forecastCards.innerHTML = '';

            for (let i = 0; i < Math.min(12, hourly.time.length); i++) {
                const time = new Date(hourly.time[i]);
                const temp = hourly.temperature_2m[i];
                const weatherCode = hourly.weather_code[i];
                const precipitation = hourly.precipitation_probability[i];

                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <div class="forecast-time">${time.getHours().toString().padStart(2, '0')}:00</div>
                    <div class="forecast-icon">${getWeatherIcon(weatherCode)}</div>
                    <div class="forecast-temp">${Math.round(temp)}°C</div>
                    <div style="font-size: 0.8em; opacity: 0.8;">💧 ${precipitation}%</div>
                `;
                forecastCards.appendChild(card);
            }

            // Show weather data
            hideLoading();
            mainWeather.style.display = 'block';
            hourlyForecast.style.display = 'block';
            errorMessage.classList.remove('show');
        }

        // Search for India on page load
        document.getElementById('cityInput').value = 'Delhi';
        searchWeather();
    </script>
</body>
</html>
